---
- name: Install watchdog script
  ansible.builtin.template:
    src: kiosk-watchdog.sh.j2
    dest: /usr/local/sbin/kiosk-watchdog
    owner: root
    group: root
    mode: "0755"

- name: Install watchdog service
  ansible.builtin.template:
    src: kiosk-watchdog.service.j2
    dest: /etc/systemd/system/kiosk-watchdog.service
    owner: root
    group: root
    mode: "0644"

- name: Enable watchdog
  ansible.builtin.systemd:
    name: kiosk-watchdog
    enabled: true
    state: started
    daemon_reload: true
